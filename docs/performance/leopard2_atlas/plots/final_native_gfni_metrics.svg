<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
<rect width="900" height="520" fill="white"/>
<text x="450" y="30" text-anchor="middle" font-family="sans-serif" font-size="20">Final-source GF16 metrics vs native Leopard1</text>

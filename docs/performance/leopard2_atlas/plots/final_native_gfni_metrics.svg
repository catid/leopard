<rect x="540" y="90" width="65" height="210" fill="#777"/><rect x="610" y="195" width="65" height="105" fill="#2b6cb0"/><rect x="730" y="90" width="65" height="210" fill="#777"/><rect x="800" y="226" width="65" height="74" fill="#2b6cb0"/>
<text x="572" y="320" text-anchor="middle" font-family="sans-serif" font-size="12">L1 enc</text><text x="642" y="320" text-anchor="middle" font-family="sans-serif" font-size="12">L2 enc</text><text x="762" y="320" text-anchor="middle" font-family="sans-serif" font-size="12">L1 dec</text><text x="832" y="320" text-anchor="middle" font-family="sans-serif" font-size="12">L2 dec</text>
<text x="572" y="82" text-anchor="middle" font-family="sans-serif" font-size="12">32</text><text x="642" y="187" text-anchor="middle" font-family="sans-serif" font-size="12">16.0</text><text x="762" y="82" text-anchor="middle" font-family="sans-serif" font-size="12">128</text><text x="832" y="218" text-anchor="middle" font-family="sans-serif" font-size="12">11.2</text>
<text x="450" y="380" text-anchor="middle" font-family="sans-serif" font-size="14">L2 setup: 3.9–4.1 µs codec creation; 55.8–107.4 µs decode-plan setup</text>

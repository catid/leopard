<rect x="95" y="165" width="55" height="135" fill="#777"/><rect x="155" y="109" width="55" height="191" fill="#2b6cb0"/><rect x="255" y="167" width="55" height="133" fill="#777"/><rect x="315" y="83" width="55" height="217" fill="#2b6cb0"/>
<text x="122" y="320" text-anchor="middle" font-family="sans-serif" font-size="12">L1 one</text><text x="182" y="320" text-anchor="middle" font-family="sans-serif" font-size="12">L2 one</text><text x="282" y="320" text-anchor="middle" font-family="sans-serif" font-size="12">L1 full</text><text x="342" y="320" text-anchor="middle" font-family="sans-serif" font-size="12">L2 full</text>
<text x="122" y="157" text-anchor="middle" font-family="sans-serif" font-size="12">6.81</text><text x="182" y="101" text-anchor="middle" font-family="sans-serif" font-size="12">10.96</text><text x="282" y="159" text-anchor="middle" font-family="sans-serif" font-size="12">6.87</text><text x="342" y="75" text-anchor="middle" font-family="sans-serif" font-size="12">9.71</text>
<text x="675" y="70" text-anchor="middle" font-family="sans-serif" font-size="15">Working memory per stripe (MiB)</text>
